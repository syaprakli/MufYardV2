<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Müfettiş Yardımcısı Değerlendirme Formu</title>
  <style>
    :root { --ink: #171717; --line: #242424; --paper: #fff; --canvas: #e9ecef; --accent: #005f73; --accent-dark: #003f4c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Times New Roman", Times, serif; }
    .toolbar { position: sticky; top: 0; z-index: 1; display: flex; justify-content: center; gap: 10px; padding: 14px; background: #fff; border-bottom: 1px solid #cbd2d6; font-family: "Times New Roman", Times, serif; }
    button { border: 1px solid var(--accent); border-radius: 4px; padding: 9px 14px; color: #fff; background: var(--accent); font: 700 14px "Times New Roman", Times, serif; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button.secondary { color: var(--accent); background: #fff; }
    .page { width: 210mm; min-height: 297mm; margin: 22px auto; padding: 18mm 25mm 20mm; background: var(--paper); box-shadow: 0 2px 18px #0002; }
    .doc-ref { text-align: right; font: 700 11pt "Times New Roman", serif; margin-bottom: 8mm; }
    h1 { margin: 0 0 12mm; text-align: center; font-size: 16pt; }
    .form-meta { display: grid; grid-template-columns: 1fr auto; gap: 7mm 8mm; margin-bottom: 14mm; font-size: 11pt; }
    .field { display: flex; align-items: baseline; gap: 6px; }
    .field label { white-space: nowrap; }
    .evaluated-label { min-height: 8mm; align-items: center; }
    .value-aligned label { width: 34mm; }
    .date-field { justify-self: end; width: fit-content; gap: 2px; font-size: 12pt; }
    .date-field input[type="text"] { flex: 0 0 25mm; width: 25mm; max-width: 25mm; margin-left: 0; text-align: right; padding: 0; }
    input[type="text"], input[type="date"], select { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid #777; padding: 2px 3px; color: var(--ink); background: transparent; font: inherit; }
    .wide { grid-column: 1 / -1; max-width: none; width: 100%; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 10.5pt; }
    th, td { border: 1px solid var(--line); }
    th { height: 11mm; font-size: 10.5pt; }
    th:first-child { width: 40%; }
    th:not(:first-child) { width: 20%; }
    td.criterion { padding: 3px 4px; line-height: 1.18; }
    td.choice { padding: 0; text-align: center; }
    .choice label { display: grid; place-items: center; width: 100%; height: 100%; min-height: 8mm; cursor: pointer; }
    input[type="radio"] { width: 14px; height: 14px; accent-color: var(--accent); }
    .tickmark { display: none; font-size: 13pt; font-weight: 700; line-height: 1; }
    .export-mode input[type="text"],
    .export-mode input[type="date"] { border-bottom: 0 !important; }
    .export-mode .choice input[type="radio"] { display: none; }
    .export-mode .choice .tickmark { display: inline; }
    .export-mode .choice input[type="radio"]:checked + .tickmark::before { content: "✓"; }
    .notes { min-height: 42mm; border: 1px solid var(--line); border-top: 0; padding: 4px; }
    .notes label { display: block; font-size: 10.5pt; font-weight: 700; text-decoration: underline; }
    textarea { display: block; width: 100%; min-height: 32mm; resize: none; overflow: hidden; border: 0; padding: 4px 3px; background: transparent; color: var(--ink); font: 10.5pt/1.35 "Times New Roman", Times, serif; text-align: justify; text-justify: inter-word; white-space: pre-wrap; overflow-wrap: break-word; }
    .export-field { display: inline-block; width: 100%; min-height: 1em; color: var(--ink); font: inherit; white-space: pre-wrap; overflow-wrap: break-word; }
    .export-notes { width: 100%; min-height: 32mm; padding: 4px 3px; color: var(--ink); font: 10.5pt/1.35 "Times New Roman", Times, serif; text-align: justify; text-justify: inter-word; white-space: pre-wrap; overflow-wrap: break-word; }
    .evaluator { width: 42%; margin: 8mm 4mm 0 auto; font-size: 10.5pt; }
    .evaluator strong { display: block; margin-bottom: 3mm; }
    .evaluator .field { margin: 2mm 0; display: flex; align-items: baseline; gap: 6px; }
    .evaluator .field.signature { margin-top: 6mm; }
    #fullName, #title, #evaluatorName, #evaluatorTitle, #signature { text-align: center; text-align-last: center; }
    @media (max-width: 680px) { .page { width: 100%; min-height: auto; margin: 0; padding: 24px; box-shadow: none; } .doc-ref { margin-bottom: 18px; } .form-meta { grid-template-columns: 1fr; gap: 14px; margin-bottom: 24px; } .wide { max-width: none; } table { font-size: 9pt; } th { font-size: 8.5pt; } th:first-child { width: 49%; } th:not(:first-child) { width: 17%; } .evaluator { width: 58%; } }
    @media print { @page { size: A4 portrait; margin: 0; } body { background: #fff; } .toolbar { display: none; } .page { width: 210mm; min-height: 297mm; margin: 0; padding: 18mm 25mm 20mm; box-shadow: none; } input, textarea { appearance: none; -webkit-appearance: none; } textarea { resize: none; } }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Belge işlemleri">
    <button type="button" class="secondary" id="saveButton">Taslağı Kaydet</button>
    <button type="button" class="secondary" id="clearButton">Taslağı Temizle</button>
    <button type="button" class="secondary" id="downloadButton">PDF Olarak İndir</button>
    <button type="button" class="secondary" id="wordDownloadButton">Word Olarak İndir</button>
    <button type="button" id="printButton">Yazdır / PDF Olarak Kaydet</button>
  </nav>
  <main class="page">
    <div class="doc-ref">EK-1</div>
    <h1>MÜFETTİŞ YARDIMCISI DEĞERLENDİRME FORMU</h1>
    <section class="form-meta" aria-label="Değerlendirilen bilgileri">
      <div class="field evaluated-label"><span>DEĞERLENDİRİLEN</span></div>
      <div class="field date-field"><label for="date">TARİH:</label><input id="date" name="date" type="text" inputmode="numeric" maxlength="10" placeholder="GG.AA.YYYY"></div>
      <div class="field wide value-aligned"><label for="fullName">ADI SOYADI:</label><input id="fullName" name="fullName" type="text"></div>
      <div class="field wide value-aligned"><label for="title">UNVANI:</label><input id="title" name="title" type="text" value="Müfettiş Yardımcısı"></div>
    </section>
    <table>
      <thead><tr><th scope="col"></th><th scope="col">ÇOK İYİ</th><th scope="col">İYİ</th><th scope="col">GELİŞTİRMELİ</th></tr></thead>
      <tbody id="criteria"></tbody>
    </table>
    <section class="notes"><label for="notes">AÇIKLAMA:</label><textarea id="notes" name="notes"></textarea></section>
    <section class="evaluator" aria-label="Değerlendiren bilgileri">
      <strong>DEĞERLENDİREN</strong>
      <div class="field"><label for="evaluatorName">Adı Soyadı:</label><input id="evaluatorName" name="evaluatorName" type="text"></div>
      <div class="field">
        <label for="evaluatorTitle">Unvanı:</label>
        <select id="evaluatorTitle" name="evaluatorTitle">
          <option value="" disabled selected hidden>Unvanı Seçiniz</option>
          <option value="Başmüfettiş">Başmüfettiş</option>
          <option value="Müfettiş">Müfettiş</option>
          <option value="Müfettiş Yardımcısı">Müfettiş Yardımcısı</option>
        </select>
      </div>
      <div class="field signature"><label for="signature">İmza:</label><input id="signature" name="signature" type="text"></div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const criteria = [
      "Takım Çalışmasına Yatkınlığı", "Motivasyon Seviyesi (görevine bağlılığı, iş heyecanı)", "Stresle Başa Çıkma Düzeyi", "Kendini Yazılı ve Sözlü İfade Becerisi", "Disipline Riayeti", "Uyumluluğu (işbirliği yapmada ve değişen şartlara, görevlere uyumda gösterdiği başarı)", "Mesai Saatlerine Riayeti", "Sosyal ve Beşeri İlişkileri", "Mesleki ve Kişisel Gelişme İçin Harcadığı Çaba", "Mesleki Temsil Becerisi (protokol kurallarına uyma, kılık kıyafet seçimi, tutum ve davranışları)", "Verilen İşi Zamanında ve Kusursuz, Uygun, Eksiksiz Yerine Getirme Becerisi"
    ];
    const ratings = ["Çok iyi", "İyi", "Geliştirmeli"];
    document.querySelector("#criteria").innerHTML = criteria.map((criterion, index) => `<tr><td class="criterion">${criterion}</td>${ratings.map((rating, ratingIndex) => `<td class="choice"><label aria-label="${criterion}: ${rating}"><input type="radio" name="criterion-${index}" value="${ratingIndex}"><span class="tickmark" aria-hidden="true"></span></label></td>`).join("")}</tr>`).join("");
    const formFields = () => [...document.querySelectorAll("input, select, textarea")];
    const storageKey = "mufettis-yardimcisi-degerlendirme-formu";

    function normalizeDateValue(value) {
      if (!value) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        const [year, month, day] = value.split("-");
        return `${day}.${month}.${year}`;
      }
      return value;
    }

    function formatDateInput(rawValue) {
      const digits = rawValue.replace(/\D/g, "").slice(0, 8);
      const parts = [];
      if (digits.length > 0) parts.push(digits.slice(0, 2));
      if (digits.length > 2) parts.push(digits.slice(2, 4));
      if (digits.length > 4) parts.push(digits.slice(4, 8));
      return parts.join(".");
    }

    function buildExportClone(source) {
      const clone = source.cloneNode(true);
      clone.style.position = "fixed";
      clone.style.left = "-100000px";
      clone.style.top = "0";
      clone.style.margin = "0";
      clone.style.boxShadow = "none";
      clone.style.background = "#ffffff";
      clone.classList.add("export-mode");

      clone.querySelectorAll('input[type="text"], input[type="date"], select').forEach(input => {
        const text = document.querySelector(`#${input.id}`)?.value || "";
        const replacement = document.createElement("span");
        replacement.className = "export-field";
        replacement.textContent = text;
        input.replaceWith(replacement);
      });

      clone.querySelectorAll("textarea").forEach(area => {
        const sourceArea = document.querySelector(`#${area.id}`);
        const replacement = document.createElement("div");
        replacement.className = "export-notes";
        replacement.textContent = sourceArea ? sourceArea.value : "";
        area.replaceWith(replacement);
      });

      clone.querySelectorAll('input[type="radio"]').forEach(radio => {
        const checked = document.querySelector(`input[name="${radio.name}"][value="${radio.value}"]`)?.checked;
        if (checked) radio.setAttribute("checked", "checked");
        else radio.removeAttribute("checked");
      });

      document.body.appendChild(clone);
      return clone;
    }
    function autoResizeNotes() {
      const notes = document.querySelector("#notes");
      if (!notes) return;
      if (!notes.dataset.minHeight) notes.dataset.minHeight = String(notes.clientHeight);
      notes.style.height = "auto";
      const minHeight = Number(notes.dataset.minHeight || 0);
      notes.style.height = `${Math.max(notes.scrollHeight, minHeight)}px`;
    }

    function saveDraft() {
      const data = {};
      formFields().forEach(field => { if (field.type !== "radio" || field.checked) data[field.name] = field.value; });
      localStorage.setItem(storageKey, JSON.stringify(data));
      const button = document.querySelector("#saveButton");
      button.textContent = "Taslak Kaydedildi";
      setTimeout(() => { button.textContent = "Taslağı Kaydet"; }, 1600);
    }

    function clearDraft() {
      localStorage.removeItem(storageKey);
      formFields().forEach(field => {
        if (field.type === "radio") field.checked = false;
        else field.value = "";
      });
      autoResizeNotes();
      const button = document.querySelector("#clearButton");
      button.textContent = "Temizlendi";
      setTimeout(() => { button.textContent = "Taslağı Temizle"; }, 1400);
    }

    function loadDraft() {
      const data = JSON.parse(localStorage.getItem(storageKey) || "{}");
      formFields().forEach(field => { if (data[field.name] !== undefined) { if (field.type === "radio") field.checked = field.value === data[field.name]; else field.value = data[field.name]; } });
      const dateField = document.querySelector("#date");
      dateField.value = normalizeDateValue(dateField.value);
      autoResizeNotes();
    }

    function validateForm() {
      // 1. Değerlendirme kriterleri kontrolü
      for (let i = 0; i < criteria.length; i++) {
        const selected = document.querySelector(`input[name="criterion-${i}"]:checked`);
        if (!selected) {
          alert(`Lütfen tüm değerlendirme kriterlerini işaretleyiniz.\nEksik Kriter: "${criteria[i]}"`);
          return false;
        }
      }
      
      // 2. Temel bilgi alanları kontrolü
      const dateVal = document.querySelector("#date").value.trim();
      const fullNameVal = document.querySelector("#fullName").value.trim();
      const titleVal = document.querySelector("#title").value.trim();
      const evalNameVal = document.querySelector("#evaluatorName").value.trim();
      const evalTitleVal = document.querySelector("#evaluatorTitle").value.trim();
      
      if (!dateVal) {
        alert("Lütfen tarihi giriniz.");
        return false;
      }
      if (!fullNameVal) {
        alert("Lütfen değerlendirilen müfettiş yardımcısının adını soyadını giriniz.");
        return false;
      }
      if (!titleVal) {
        alert("Lütfen değerlendirilen müfettiş yardımcısının unvanını giriniz.");
        return false;
      }
      if (!evalNameVal) {
        alert("Lütfen değerlendiren müfettişin adını soyadını giriniz.");
        return false;
      }
      if (!evalTitleVal) {
        alert("Lütfen değerlendiren müfettişin unvanını seçiniz.");
        return false;
      }
      
      return true;
    }

    document.querySelector("#date").addEventListener("input", event => {
      const el = event.target;
      el.value = formatDateInput(el.value);
    });
    document.querySelector("#notes").addEventListener("input", autoResizeNotes);
    document.querySelector("#saveButton").addEventListener("click", saveDraft);
    document.querySelector("#clearButton").addEventListener("click", clearDraft);
    document.querySelector("#printButton").addEventListener("click", () => {
      if (!validateForm()) return;
      window.print();
    });
    document.querySelector("#wordDownloadButton").addEventListener("click", () => {
      if (!validateForm()) return;
      const ratings = {};
      criteria.forEach((_, idx) => {
        const selected = document.querySelector(`input[name="criterion-${idx}"]:checked`);
        ratings[idx] = selected ? selected.value : "";
      });
      const data = {
        date: document.querySelector("#date").value,
        fullName: document.querySelector("#fullName").value,
        title: document.querySelector("#title").value,
        ratings: ratings,
        notes: document.querySelector("#notes").value,
        evaluatorName: document.querySelector("#evaluatorName").value,
        evaluatorTitle: document.querySelector("#evaluatorTitle").value,
        signature: document.querySelector("#signature").value
      };
      window.parent.postMessage({
        type: "GENERATE_WORD_DEGERLENDIRME",
        data: data
      }, "*");
    });
    document.querySelector("#downloadButton").addEventListener("click", async () => {
      if (!validateForm()) return;
      saveDraft();
      const button = document.querySelector("#downloadButton");
      button.disabled = true;
      button.textContent = "PDF Hazırlanıyor...";
      try {
        document.body.classList.add("export-mode");
        autoResizeNotes();
        const source = document.querySelector(".page");
        const exportNode = buildExportClone(source);
        const captureWidth = Math.ceil(exportNode.scrollWidth);
        const captureHeight = Math.ceil(exportNode.scrollHeight);
        const canvas = await html2canvas(exportNode, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          width: captureWidth,
          height: captureHeight,
          windowWidth: captureWidth,
          windowHeight: captureHeight,
          scrollX: 0,
          scrollY: 0
        });
        exportNode.remove();
        const imgData = canvas.toDataURL("image/jpeg", 0.98);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const pageWidth = 210;
        const pageHeight = 297;
        const imgRatio = canvas.width / canvas.height;
        const pageRatio = pageWidth / pageHeight;
        let renderWidth = pageWidth;
        let renderHeight = pageWidth / imgRatio;
        if (imgRatio < pageRatio) {
          renderHeight = pageHeight;
          renderWidth = pageHeight * imgRatio;
        }
        const offsetX = (pageWidth - renderWidth) / 2;
        const offsetY = (pageHeight - renderHeight) / 2;
        pdf.addImage(imgData, "JPEG", offsetX, offsetY, renderWidth, renderHeight);
        pdf.save("mufettis-yardimcisi-degerlendirme-formu.pdf");
      } finally {
        document.querySelectorAll(".page.export-mode").forEach(node => node.remove());
        document.body.classList.remove("export-mode");
        button.disabled = false;
        button.textContent = "PDF Olarak İndir";
      }
    });
    loadDraft();
  </script>
</body>
</html>
