<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görevlendirme Ücreti Hesaplama Cetveli</title>
    
    <!-- React & ReactDOM (Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- XLSX for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Outfit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        /* Custom scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Print styles */
        @media print {
            body * {
                visibility: hidden;
            }
            #gorev-print-area, #gorev-print-area * {
                visibility: visible;
            }
            #gorev-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <!-- React App Root Container -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Constants - Memur Aylık Katsayıları
        const YOLLUK_COEFFICIENTS = {
            "2026": {
                jan_jun: 1.387871,
                jul_dec: 1.575512
            },
            "2025": {
                jan_jun: 1.012556,
                jul_dec: 1.170211
            },
            "2024": {
                jan_jun: 0.760871,
                jul_dec: 0.907796
            },
            "2023": {
                jan_jun: 0.433684,
                jul_dec: 0.509796
            },
            "2022": {
                jan_jun: 0.235445,
                jul_dec: 0.333603
            },
            "2021": {
                jan_jun: 0.165786,
                jul_dec: 0.179797
            },
            "2020": {
                jan_jun: 0.146061,
                jul_dec: 0.154461
            }
        };

        const GOREV_TABLES = {
            tablo1: {
                title: "1 Sayılı Tablo (Günlük Ödemeler)",
                unit: "Gün",
                roles: [
                    { name: "Gençlik ve Spor Yöneticisi", indicator: 300 },
                    { name: "Gençlik ve Spor Yöneticisi Yardımcısı", indicator: 220 },
                    { name: "Doktor", indicator: 1000 },
                    { name: "Doktor (Dışarıdan Görevlendirilen Uzman - %50 Fazlası)", indicator: 1500 },
                    { name: "Gençlik Eğitim Şefi, Psikolog, Antrenör, Öğretmen, Lider vb.", indicator: 400 },
                    { name: "Aşçı", indicator: 400 },
                    { name: "Deniz Motoru Kaptanı, Şoför, Garson, Hizmetli, Teknisyen vb.", indicator: 200 }
                ]
            },
            tablo2: {
                title: "2 Sayılı Tablo (Saatlik Ödemeler)",
                unit: "Saat",
                roles: [
                    { name: "Eğitici, Öğretici, Çalıştırıcı, Lider, Monitör, Antrenör vb.", indicator: 200 },
                    { name: "Kamp Eğitim Öğretim Elemanı, Öğretmen, Eğitim Yöneticisi, Tercüman vb.", indicator: 300 },
                    { name: "Tesis Müdürü, Tesis Şefi, Teknik Elemanlar vb.", indicator: 200 },
                    { name: "Destek Hizmeti (Ambar Memuru, Şoför, Elektrikçi vb.)", indicator: 150 }
                ]
            },
            tablo3: {
                title: "3 Sayılı Tablo (Seanslık Ödemeler)",
                unit: "Seans",
                roles: [
                    { name: "Bakanlık, MEB, Gözlemci, Temsilci, Genel Sekreter vb.", indicator: 350 },
                    { name: "Doktor", indicator: 600 },
                    { name: "Müsabaka Müdürü, Mutemet, Tesis Amiri, Saha Komiseri, İl Temsilcisi vb.", indicator: 250 },
                    { name: "Gişe Memuru, Şoför, Kontrol Memuru, Spiker, Teşrifatçı vb.", indicator: 200 },
                    { name: "Sayı Yazıcısı, Top Toplayıcısı", indicator: 150 }
                ]
            },
            tablo4: {
                title: "4 Sayılı Tablo (İl Hakem Ödemeleri)",
                unit: "Müsabaka/Seans",
                roles: [
                    { name: "Takım - Uluslararası Hakem (Baş-Orta)", indicator: 400 },
                    { name: "Takım - Uluslararası Hakem (Yan-Yardımcı/Masa)", indicator: 300 },
                    { name: "Takım - Ulusal Hakem (Baş-Orta)", indicator: 350 },
                    { name: "Takım - Ulusal Hakem (Yan-Yardımcı/Masa)", indicator: 275 },
                    { name: "Takım - İl Hakemi (Baş-Orta)", indicator: 300 },
                    { name: "Takım - İl Hakemi (Yan-Yardımcı/Masa)", indicator: 250 },
                    { name: "Takım - Aday Hakem (Baş-Orta)", indicator: 250 },
                    { name: "Takım - Aday Hakem (Yan-Yardımcı/Masa)", indicator: 225 },
                    { name: "Okul Sporları Futbol-Futsal Hakemi (Baş-Orta)", indicator: 350 },
                    { name: "Okul Sporları Futbol-Futsal Hakemi (Yardımcı/Masa)", indicator: 250 },
                    { name: "Ferdi - Uluslararası Hakem (Baş-Müsabaka)", indicator: 400 },
                    { name: "Ferdi - Ulusal Hakem (Baş-Müsabaka)", indicator: 350 },
                    { name: "Ferdi - İl Hakemi (Baş-Müsabaka)", indicator: 300 },
                    { name: "Ferdi - Aday Hakem (Baş-Müsabaka)", indicator: 250 }
                ]
            },
            tablo5: {
                title: "5 Sayılı Tablo (Federasyon Hakem Ödemeleri)",
                unit: "Müsabaka/Seans",
                roles: [
                    { name: "Takım - Uluslararası Hakem (Baş-Orta)", indicator: 600 },
                    { name: "Takım - Uluslararası Hakem (Yan-Yardımcı/Masa)", indicator: 400 },
                    { name: "Takım - Ulusal Hakem (Baş-Orta)", indicator: 500 },
                    { name: "Takım - Ulusal Hakem (Yan-Yardımcı/Masa)", indicator: 375 },
                    { name: "Takım - İl Hakemi (Baş-Orta)", indicator: 450 },
                    { name: "Takım - İl Hakemi (Yan-Yardımcı/Masa)", indicator: 350 },
                    { name: "Takım - Aday Hakem (Baş-Orta)", indicator: 400 },
                    { name: "Takım - Aday Hakem (Yan-Yardımcı/Masa)", indicator: 325 },
                    { name: "Ferdi - Uluslararası Hakem (Baş-Müsabaka)", indicator: 600 },
                    { name: "Ferdi - Ulusal Hakem (Baş-Müsabaka)", indicator: 550 },
                    { name: "Ferdi - İl Hakemi (Baş-Müsabaka)", indicator: 500 },
                    { name: "Ferdi - Aday Hakem (Baş-Müsabaka)", indicator: 450 }
                ]
            },
            tablo6: {
                title: "6 Sayılı Tablo (Jüri ve Seçici Kurul)",
                unit: "Seans",
                roles: [
                    { name: "Jüri ve Seçici Kurul Üyesi", indicator: 600 }
                ]
            }
        };

        function App() {
            const [gorevYear, setGorevYear] = useState("2026");
            const [gorevPeriod, setGorevPeriod] = useState("jan_jun");
            const [gorevTable, setGorevTable] = useState("tablo1");
            const [gorevRoleIndex, setGorevRoleIndex] = useState(0);
            const [gorevDuration, setGorevDuration] = useState(1);
            const [gorevGelirVergisiRate, setGorevGelirVergisiRate] = useState(15);
            const [gorevDamgaVergisiRate, setGorevDamgaVergisiRate] = useState(0.759);
            const [gorevIsArtirimli, setGorevIsArtirimli] = useState(false);

            // Online config from GitHub
            const [liveConfig, setLiveConfig] = useState(null);

            useEffect(() => {
                const fetchLiveConfig = async () => {
                    try {
                        const response = await fetch("https://raw.githubusercontent.com/syaprakli/MufYardV2/main/frontend/public/mufyard_rates.json");
                        if (response.ok) {
                            const data = await response.json();
                            setLiveConfig(data);
                            return;
                        }
                    } catch (e) {
                        console.warn("GitHub live config fetch failed, falling back to local...", e);
                    }
                };
                fetchLiveConfig();
            }, []);

            // Resolve coefficients from live config or local fallback
            const activeCoefficients = useMemo(() => {
                if (liveConfig && liveConfig.coefficients) {
                    return liveConfig.coefficients;
                }
                return YOLLUK_COEFFICIENTS;
            }, [liveConfig]);

            const katsayi = useMemo(() => {
                return activeCoefficients[gorevYear]?.[gorevPeriod] || 1.387871;
            }, [activeCoefficients, gorevYear, gorevPeriod]);

            const selectedTableData = useMemo(() => {
                return GOREV_TABLES[gorevTable] || GOREV_TABLES.tablo1;
            }, [gorevTable]);

            const selectedRole = useMemo(() => {
                return selectedTableData.roles[gorevRoleIndex] || selectedTableData.roles[0];
            }, [selectedTableData, gorevRoleIndex]);

            const indicator = useMemo(() => {
                let ind = selectedRole.indicator;
                if (gorevIsArtirimli) {
                    ind = ind * 1.5;
                }
                return ind;
            }, [selectedRole, gorevIsArtirimli]);

            const calculations = useMemo(() => {
                const gross = indicator * katsayi * gorevDuration;
                const gelirVergisi = gross * (gorevGelirVergisiRate / 100);
                const damgaVergisi = gross * (gorevDamgaVergisiRate / 100);
                const kesintiToplam = gelirVergisi + damgaVergisi;
                const net = gross - kesintiToplam;

                return {
                    gross,
                    gelirVergisi,
                    damgaVergisi,
                    kesintiToplam,
                    net
                };
            }, [indicator, katsayi, gorevDuration, gorevGelirVergisiRate, gorevDamgaVergisiRate]);

            const formatCurrency = (val) => {
                return new Intl.NumberFormat("tr-TR", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(val);
            };

            const handlePrint = () => {
                window.print();
            };

            const handleExportExcel = () => {
                const wb = XLSX.utils.book_new();
                const data = [
                    ["GÖREVLENDİRME ÜCRET HESAPLAMA RAPORU"],
                    ["Tarih", new Date().toLocaleDateString("tr-TR")],
                    [],
                    ["Hesaplama Parametreleri", "Değer"],
                    ["Hesaplama Yılı / Dönemi", `${gorevYear} - ${gorevPeriod === "jan_jun" ? "Ocak-Haziran" : "Temmuz-Aralık"}`],
                    ["İlgili Genelge Tablosu", selectedTableData.title],
                    ["Görev / Unvan", selectedRole.name],
                    ["Kadro Göstergesi", { t: "n", v: indicator, z: "#,##0" }],
                    ["Memur Maaş Katsayısı", { t: "n", v: katsayi, z: "0.000000" }],
                    ["Görev Süresi (" + selectedTableData.unit + ")", { t: "n", v: gorevDuration, z: "#,##0" }],
                    [],
                    ["Hesaplama Kalemleri", "Oran / Değer", "Tutar (TL)"],
                    ["Brüt Görevlendirme Ücreti", "Gösterge x Katsayı x Süre", { t: "n", f: "B8*B9*B10", z: "#,##0.00" }],
                    ["Gelir Vergisi Kesintisi", { t: "n", v: gorevGelirVergisiRate / 100, z: "0%" }, { t: "n", f: "C13*B14", z: "#,##0.00" }],
                    ["Damga Vergisi Kesintisi", { t: "n", v: gorevDamgaVergisiRate / 100, z: "0.000%" }, { t: "n", f: "C13*B15", z: "#,##0.00" }],
                    ["Toplam Kesinti", "", { t: "n", f: "C14+C15", z: "#,##0.00" }],
                    ["Net Ödenecek Tutar", "", { t: "n", f: "C13-C16", z: "#,##0.00" }]
                ];

                const ws = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "Görev Ücreti Hesaplama");
                XLSX.writeFile(wb, `Gorevlendirme_Ucreti_Hesabi_${gorevYear}.xlsx`);
            };

            const sortedYears = Object.keys(activeCoefficients).sort((a, b) => b.localeCompare(a));

            return (
                <div className="w-full bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 shadow-2xl rounded-[32px] p-6 flex flex-col gap-6 overflow-hidden">
                    
                    {/* Header */}
                    <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4 no-print">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-indigo-500/10 text-indigo-500 rounded-2xl">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-slate-900 dark:text-slate-100 tracking-tight">Görevlendirme Ücreti Hesaplama Cetveli</h1>
                                <p className="text-xs text-slate-500 font-semibold mt-0.5">Gençlik ve Spor Hizmetleri unvan göstergelerine göre resmi ödeme hesaplama kartı.</p>
                            </div>
                        </div>
                    </div>

                    {/* Main Split Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
                        {/* LEFT: Inputs */}
                        <div className="lg:col-span-5 space-y-4 no-print">
                            {/* Year and Period */}
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Hesap Yılı</label>
                                    <select 
                                        value={gorevYear} 
                                        onChange={(e) => {
                                            setGorevYear(e.target.value);
                                            setGorevRoleIndex(0);
                                        }}
                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                    >
                                        {sortedYears.map(yr => (
                                            <option key={yr} value={yr}>{yr} Yılı</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Katsayı Dönemi</label>
                                    <select 
                                        value={gorevPeriod} 
                                        onChange={(e) => setGorevPeriod(e.target.value)}
                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                    >
                                        <option value="jan_jun">1 Ocak - 30 Haziran</option>
                                        <option value="jul_dec">1 Temmuz - 31 Aralık</option>
                                    </select>
                                </div>
                            </div>

                            {/* Table Selection */}
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Görevlendirme Genelge Tablosu</label>
                                <select 
                                    value={gorevTable} 
                                    onChange={(e) => {
                                        setGorevTable(e.target.value);
                                        setGorevRoleIndex(0);
                                    }}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                >
                                    {Object.entries(GOREV_TABLES).map(([key, val]) => (
                                        <option key={key} value={key}>{val.title}</option>
                                    ))}
                                </select>
                            </div>

                            {/* Role Selection */}
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Görev / Unvan Seçimi</label>
                                <select 
                                    value={gorevRoleIndex} 
                                    onChange={(e) => setGorevRoleIndex(parseInt(e.target.value) || 0)}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                >
                                    {selectedTableData.roles.map((r, idx) => (
                                        <option key={idx} value={idx}>{r.name} ({r.indicator} Gösterge)</option>
                                    ))}
                                </select>
                            </div>

                            {/* Duration / Count */}
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Görev Süresi ({selectedTableData.unit})</label>
                                <input 
                                    type="number" 
                                    value={gorevDuration || ""} 
                                    min={1}
                                    onChange={(e) => setGorevDuration(Math.max(1, parseInt(e.target.value) || 1))}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                />
                            </div>

                            {/* Tax Rates */}
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Gelir Vergisi</label>
                                    <select 
                                        value={gorevGelirVergisiRate} 
                                        onChange={(e) => setGorevGelirVergisiRate(parseFloat(e.target.value) || 0)}
                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                    >
                                        <option value={15}>%15 (Standart)</option>
                                        <option value={20}>%20</option>
                                        <option value={27}>%27</option>
                                        <option value={35}>%35</option>
                                        <option value={40}>%40</option>
                                        <option value={0}>%0 (Kesintisiz)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-wide text-slate-400 block mb-1">Damga Vergisi</label>
                                    <select 
                                        value={gorevDamgaVergisiRate} 
                                        onChange={(e) => setGorevDamgaVergisiRate(parseFloat(e.target.value) || 0)}
                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-2.5 outline-none text-xs font-bold focus:ring-1 focus:ring-indigo-500"
                                    >
                                        <option value={0.759}>%0,759 (Binde 7.59)</option>
                                        <option value={0}>%0 (Kesintisiz)</option>
                                    </select>
                                </div>
                            </div>

                            {/* %50 Artırım Checkbox */}
                            <div className="pt-2 border-t border-slate-100 dark:border-slate-800">
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input 
                                        type="checkbox"
                                        checked={gorevIsArtirimli}
                                        onChange={(e) => setGorevIsArtirimli(e.target.checked)}
                                        className="rounded text-indigo-650 focus:ring-indigo-500 h-4 w-4 bg-white border border-slate-300 dark:border-slate-800"
                                    />
                                    <span className="text-xs font-bold text-slate-700 dark:text-slate-350 select-none">
                                        İl Hudutları İçi / Memuriyet Mahalli Dışı (%50 Artırımlı)
                                    </span>
                                </label>
                            </div>

                            {/* Katsayı Bilgilendirme */}
                            <div className="bg-indigo-50/50 dark:bg-indigo-950/10 p-3.5 rounded-2xl border border-indigo-100/50 dark:border-indigo-900/30 text-xs space-y-1.5 text-slate-500 dark:text-slate-400 font-bold">
                                <span className="font-extrabold text-indigo-600 dark:text-indigo-400 block mb-1">ℹ️ Aktif Dönem Katsayısı:</span>
                                <div className="space-y-1">
                                    <div>• Aylık Katsayı: <span className="text-slate-850 dark:text-slate-200">{katsayi.toFixed(6)}</span></div>
                                    <div>• Hesaplamaya Esas Gösterge: <span className="text-slate-850 dark:text-slate-200">{indicator}</span></div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT: Calculation Sheet */}
                        <div className="lg:col-span-7 flex flex-col justify-between overflow-hidden">
                            <div 
                                id="gorev-print-area"
                                className="bg-white dark:bg-slate-950 p-6 rounded-2xl border border-slate-200 dark:border-slate-800/80 shadow-inner space-y-4"
                            >
                                {/* Cetvel Header */}
                                <div className="text-center border-b border-slate-200 dark:border-slate-800 pb-3">
                                    <h2 className="text-sm font-black uppercase text-slate-900 dark:text-slate-100 tracking-wider">
                                        T.C. GENÇLİK VE SPOR BAKANLIĞI
                                    </h2>
                                    <p className="text-[10px] font-black tracking-widest text-indigo-600 dark:text-indigo-400 mt-1 uppercase">
                                        Görevlendirme Ücreti Hesap Bildirimi
                                    </p>
                                </div>

                                {/* Summary Grid */}
                                <div className="grid grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl text-xs font-bold border border-slate-100 dark:border-slate-800/85">
                                    <div className="space-y-1.5">
                                        <div className="text-slate-500">Yıl / Dönem: <span className="text-slate-850 dark:text-slate-200">{gorevYear} - {gorevPeriod === "jan_jun" ? "Ocak-Haziran" : "Temmuz-Aralık"}</span></div>
                                        <div className="text-slate-500">Katsayı: <span className="text-slate-850 dark:text-slate-200">{katsayi.toFixed(6)}</span></div>
                                        <div className="text-slate-500">Süre: <span className="text-indigo-650 dark:text-indigo-400 font-extrabold">{gorevDuration} {selectedTableData.unit}</span></div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <div className="text-slate-500">Genelge Tablosu: <span className="text-slate-850 dark:text-slate-200">{selectedTableData.title}</span></div>
                                        <div className="text-slate-500">Esas Gösterge: <span className="text-slate-850 dark:text-slate-200">{indicator}</span></div>
                                        <div className="text-slate-500">Net Ödenecek: <span className="text-indigo-650 dark:text-indigo-400 font-extrabold">{formatCurrency(calculations.net)} TL</span></div>
                                    </div>
                                </div>

                                {/* Details Table */}
                                <div className="space-y-2">
                                    <h4 className="text-[10px] font-black uppercase tracking-wider text-slate-400">Hesaplama Detay Cetveli</h4>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full text-xs text-left">
                                            <thead>
                                                <tr className="border-b border-slate-200 dark:border-slate-800 text-[10px] text-slate-400 uppercase font-black">
                                                    <th className="py-2">Hesap Kalemi</th>
                                                    <th className="py-2 text-right">Formül / Oran</th>
                                                    <th className="py-2 text-right">Tutar (TL)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-900 text-slate-700 dark:text-slate-350 font-bold">
                                                <tr>
                                                    <td className="py-2.5">Brüt Görevlendirme Ücreti</td>
                                                    <td className="py-2.5 text-right font-mono font-medium text-slate-400">
                                                        {indicator} x {katsayi.toFixed(6)} x {gorevDuration}
                                                    </td>
                                                    <td className="py-2.5 text-right font-mono">{formatCurrency(calculations.gross)} TL</td>
                                                </tr>
                                                {calculations.gelirVergisi > 0 && (
                                                    <tr className="text-rose-600 dark:text-rose-455">
                                                        <td className="py-2.5">Gelir Vergisi Kesintisi</td>
                                                        <td className="py-2.5 text-right font-mono font-medium text-slate-400">%{gorevGelirVergisiRate}</td>
                                                        <td className="py-2.5 text-right font-mono">-{formatCurrency(calculations.gelirVergisi)} TL</td>
                                                    </tr>
                                                )}
                                                {calculations.damgaVergisi > 0 && (
                                                    <tr className="text-rose-600 dark:text-rose-455">
                                                        <td className="py-2.5">Damga Vergisi Kesintisi</td>
                                                        <td className="py-2.5 text-right font-mono font-medium text-slate-400">
                                                            %{gorevDamgaVergisiRate} (binde {(gorevDamgaVergisiRate * 10).toFixed(3).replace(".", ",")})
                                                        </td>
                                                        <td className="py-2.5 text-right font-mono">-{formatCurrency(calculations.damgaVergisi)} TL</td>
                                                    </tr>
                                                )}
                                                <tr className="bg-slate-50/50 dark:bg-slate-900/30 text-indigo-650 dark:text-indigo-400 font-extrabold text-sm">
                                                    <td className="py-3">Net Ödenecek Görev Ücreti</td>
                                                    <td className="py-3 text-right">-</td>
                                                    <td className="py-3 text-right font-mono font-black">{formatCurrency(calculations.net)} TL</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                
                                <p className="text-[9px] font-semibold text-slate-400 dark:text-slate-500 leading-relaxed border-t border-slate-100 dark:border-slate-900 pt-3">
                                    ℹ️ Görevlendirilen personele, Tablolarda yer alan göstergelerin memur aylık katsayısı ile çarpımı üzerinden ödeme yapılır. Gelir Vergisi ve Damga Vergisi kesintileri yasal oranlara göre düşülür.
                                </p>
                            </div>

                            {/* Action Buttons */}
                            <div className="mt-6 flex items-center justify-end gap-3 no-print">
                                <button 
                                    type="button"
                                    onClick={handlePrint}
                                    className="h-11 px-6 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-black uppercase text-[10px] tracking-widest border border-slate-200/50 dark:border-slate-700 transition-all"
                                >
                                    Yazdır
                                </button>
                                <button 
                                    type="button"
                                    onClick={handleExportExcel}
                                    className="h-11 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black uppercase text-[10px] tracking-widest shadow-lg shadow-emerald-600/10 transition-all"
                                >
                                    Excel Raporu İndir
                                </button>
                            </div>
                            <div className="text-center text-[10px] text-slate-400 dark:text-slate-500 font-bold no-print pt-2 mt-4 border-t border-slate-100/50 dark:border-slate-800/50">
                                Bu bir Sefa Yapraklı Projesidir.
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
