        const ANTRENOR_PERSONEL_LISTESI = [
            { id: "a1", no: "22-a", madde: "Faaliyette bulunulan her spor branşı için en az 2. Kademe (veya federasyonca yetkili 1. Kademe) antrenörlük belgesi / masaj için masör-masöz belgesi", ref: "Yön. Md. 22/1" },

            { id: "s7", no: "19-a", madde: "Sporcu Lisans, Tescil, Vize Yönetmeliği asgari spora başlama ve lisans yaş sınırlarına uyulması", ref: "Yön. Md. 19" },
            { id: "s8", no: "25-a", madde: "Sporculardan başvuru formu, TC kimlik beyanı, veli izin belgesi (reşit olmayanlar için), sağlık raporu ve fotoğrafların tam alınması", ref: "Yön. Md. 25" },
            { id: "s9", no: "17-a", madde: "Tesisin çalışma izninde belirtilen spor dalları ve amacı dışında kesinlikle kullanılmaması", ref: "Yön. Md. 17" },
            { id: "s10", no: "18-a", madde: "İl Müdürlüğünce belirlenen açık bulunma ve sportif çalışma saatlerine riayet edilmesi", ref: "Yön. Md. 18" }

        function getInitialState() {
            try {
                const saved = localStorage.getItem("mufyard_ozel_beden_egitimi_data");
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.error("Storage error:", e);
            }
            return {
                tesisAdi: "Örnek Özel Beden Eğitimi ve Spor Tesisi",
                tur: "gercek",
                ilAdi: "VAN",
                startYear: 2024,
                endYear: 2025,
                isleticiSahip: "",
                tcVkn: "",
                telefon: "",
                adres: "",
                ilce: "",
                branslar: "Fitness, Vücut Geliştirme, Pilates",
                acilisTarihi: "",
                sonVizeTarihi: "",
                tescilNo: "",
                genelSonuc: "incelemede",
                evraklar: {},
                komisyon: {
                    valiOnayi: "",
                    komisyonKararTarihi: "",
                    komisyonKararNo: "",
                    ilMudurBaskan: "",
                    sporSbMd: "",
                    tesislerSbMd: "",
                    fedTemsilcisi: "",
                    saglikTemsilcisi: "",
                    tescilUcretiTahsilat: "",
                    tescilUcretiTutar: "",

                    ilMudurPayiYatırıldı: "",
                    cokluBransHarci: "",
                    dosyaDagitimiTam: "",
                    aciklama: ""
                },
                fizikiSartlar: {},
                antrenorPersonel: {},
                saglikSporcu: {},
                vizeYaptirim: {
                    yillikVizeYapildiMi: "",
                    vizeOnayTarihi: "",
                    oncekiIpcDurumu: "",
                    verilenSureVarMi: "",
                    tespitAykiriliklar: "",
                    sonucKarari: "Denetim devam ediyor."
                }
            };

        // ---------------------------------------------------------------------------
        // MAIN APP COMPONENT
        // ---------------------------------------------------------------------------

        function App() {
            const [formData, setFormData] = useState(getInitialState);
            const [subTab, setSubTab] = useState("evrak");
            const [searchQuery, setSearchQuery] = useState("");
            const [filterOnlyMissing, setFilterOnlyMissing] = useState(false);
            const [toastMsg, setToastMsg] = useState("");
            const [confirmModal, setConfirmModal] = useState({
                isOpen: false,
                title: "",
                message: "",
                confirmText: "Onayla",
                cancelText: "Vazgeç",
                variant: "danger",
                onConfirm: null
            });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 3000);
            };

            const openConfirm = ({ title, message, confirmText = "Onayla", cancelText = "Vazgeç", variant = "danger", onConfirm }) => {
                setConfirmModal({
                    isOpen: true,
                    title,
                    message,
                    confirmText,
                    cancelText,
                    variant,
                    onConfirm: () => {
                        if (typeof onConfirm === "function") onConfirm();
                        setConfirmModal(prev => ({ ...prev, isOpen: false }));
                    }
                });
            };

            const closeConfirm = () => {
                setConfirmModal(prev => ({ ...prev, isOpen: false }));
            };

            const handleSave = () => {
                try {
                    localStorage.setItem("mufyard_ozel_beden_egitimi_data", JSON.stringify(formData));
                    showToast("Denetim verileri başarıyla kaydedildi.");
                } catch (e) {
                    showToast("Kaydetme hatası: " + e.message);
                }
            };

            const handleReset = () => {
                openConfirm({
                    title: "Denetimi Sıfırla",
                    message: "Özel beden eğitimi tesisleri denetim formundaki tüm verileri sıfırlamak istediğinize emin misiniz? Doldurulan tüm evrak ve kontrol bilgileri temizlenecektir. Bu işlem geri alınamaz.",
                    confirmText: "Evet, Formu Sıfırla",
                    cancelText: "Vazgeç",
                    variant: "danger",
                    onConfirm: () => {
                        localStorage.removeItem("mufyard_ozel_beden_egitimi_data");
                        const fresh = getInitialState();
                        fresh.tesisAdi = "Özel Beden Eğitimi ve Spor Tesisi";
                        fresh.evraklar = {};
                        fresh.fizikiSartlar = {};
                        fresh.antrenorPersonel = {};
                        fresh.saglikSporcu = {};
                        setFormData(fresh);
                        showToast("Denetim formu sıfırlandı.");
                    }
                });
            };

            const handleInfoChange = (field, val) => {
                setFormData(prev => ({ ...prev, [field]: val }));
            };

            const handleItemChange = (section, itemId, status, note) => {
                setFormData(prev => {
                    const sec = { ...(prev[section] || {}) };
                    const cur = sec[itemId] || { status: "", note: "" };
                    sec[itemId] = {
                        status: status !== undefined ? status : cur.status,
                        note: note !== undefined ? note : cur.note
                    };
                    return { ...prev, [section]: sec };
                });
            };

            const handleKomisyonChange = (field, val) => {
                setFormData(prev => ({
                    ...prev,
                    komisyon: { ...prev.komisyon, [field]: val }
                }));
            };

            const handleVizeChange = (field, val) => {
                setFormData(prev => ({
                    ...prev,
                    vizeYaptirim: { ...prev.vizeYaptirim, [field]: val }
                }));
            };

            const handleMarkAllValid = () => {
                openConfirm({
                    title: "Tümünü Uygun İşaretle",
                    message: "Bu sekmedeki tüm maddeler 'Var / Uygun' olarak işaretlenecektir. Onaylıyor musunuz?",
                    confirmText: "Tümünü Uygun Yap",
                    cancelText: "Vazgeç",
                    variant: "info",
                    onConfirm: () => {
                        setFormData(prev => {
                            const updated = { ...prev };
                            if (subTab === "evrak") {
                                const list = prev.tur === "gercek" ? GERCEK_KISI_EVRAKLARI : TUZEL_KISI_EVRAKLARI;
                                const map = { ...(prev.evraklar || {}) };
                                list.forEach(item => { map[item.id] = { status: "var", note: map[item.id]?.note || "" }; });
                                updated.evraklar = map;
                            } else if (subTab === "fiziki") {
                                const map = { ...(prev.fizikiSartlar || {}) };
                                FIZIKI_SARTLAR_LISTESI.forEach(item => { map[item.id] = { status: "var", note: map[item.id]?.note || "" }; });
                                updated.fizikiSartlar = map;
                            } else if (subTab === "antrenor") {
                                const map = { ...(prev.antrenorPersonel || {}) };
                                ANTRENOR_PERSONEL_LISTESI.forEach(item => { map[item.id] = { status: "var", note: map[item.id]?.note || "" }; });
                                updated.antrenorPersonel = map;
                            } else if (subTab === "saglik") {
                                const map = { ...(prev.saglikSporcu || {}) };
                                SAGLIK_SPORCU_LISTESI.forEach(item => { map[item.id] = { status: "var", note: map[item.id]?.note || "" }; });
                                updated.saglikSporcu = map;
                            }
                            return updated;
                        });
                        showToast("Tüm maddeler uygun olarak işaretlendi.");
                    }
                });
            };

            // İstatistikler
            const stats = useMemo(() => {
                const evrakList = formData.tur === "gercek" ? GERCEK_KISI_EVRAKLARI : TUZEL_KISI_EVRAKLARI;
                const totalItems = evrakList.length + FIZIKI_SARTLAR_LISTESI.length + ANTRENOR_PERSONEL_LISTESI.length + SAGLIK_SPORCU_LISTESI.length;

                let varCount = 0, yokCount = 0, muafCount = 0;

                const checkSection = (list, section) => {
                    list.forEach(it => {
                        const st = formData[section]?.[it.id]?.status;
                        if (st === "var") varCount++;
                        else if (st === "yok") yokCount++;
                        else if (st === "muaf") muafCount++;
                    });
                };

                checkSection(evrakList, "evraklar");
                checkSection(FIZIKI_SARTLAR_LISTESI, "fizikiSartlar");
                checkSection(ANTRENOR_PERSONEL_LISTESI, "antrenorPersonel");
                checkSection(SAGLIK_SPORCU_LISTESI, "saglikSporcu");

                const netBase = totalItems - muafCount;
                const uyumYuzdesi = netBase > 0 ? Math.round((varCount / netBase) * 100) : 0;

                return { totalItems, varCount, yokCount, muafCount, uyumYuzdesi };
            }, [formData]);

            // Excel İndirme
            const handleExportExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();
                    const reportData = [
                        ["T.C. GENÇLİK VE SPOR BAKANLIĞI"],
                        ["REHBERLİK VE DENETİM BAŞKANLIĞI / İL MÜDÜRLÜĞÜ TEFTİŞİ"],
                        ["ÖZEL BEDEN EĞİTİMİ VE SPOR TESİSLERİ DENETİM ÇİZELGESİ"],
                        [],
                        ["TESİS BİLGİLERİ"],
                        ["Tesis Adı:", formData.tesisAdi, "Tesis Türü:", formData.tur === "gercek" ? "Gerçek Kişi" : "Tüzel Kişi (Şirket/Kulüp)"],
                        ["İşletici / Sorumlu:", formData.isleticiSahip, "T.C. / VKN:", formData.tcVkn],

                                    <div className="p-2 rounded-xl bg-slate-800">
                                        <span className="text-[10px] text-slate-400 block font-bold">Muaf</span>
                                        <span className="text-sm font-black">{stats.muafCount}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-3 border-t border-slate-800 mt-3 flex items-center justify-between text-xs">
                                <span className="text-slate-400">Karar:</span>
                                <select
                                    value={formData.genelSonuc}
                                    onChange={e => handleInfoChange("genelSonuc", e.target.value)}
                                    className="bg-slate-800 text-white font-bold text-xs px-2 py-1 rounded-lg border border-slate-700 outline-none"
                                >
                                    <option value="incelemede">İncelemede</option>
                                    <option value="uygun">Mevzuata Uygun</option>
                                    <option value="eksik">Süre Verildi</option>
                                    <option value="ipc">İdari Para Cezası (İPC)</option>
                                    <option value="kapatma">Faaliyetten Men / İptal</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* SEKME MENÜSÜ */}
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-2 no-print">
                        <div className="flex flex-wrap items-center gap-1.5">
                            {[
                                { id: "evrak", label: `1. Açılış Evrakı (${formData.tur === "gercek" ? "Gerçek" : "Tüzel"})` },
                                { id: "komisyon", label: "2. Komisyon & Harç" },
                                { id: "fiziki", label: "3. Fiziki Şartlar (Md. 8-9)" },
                                { id: "antrenor", label: "4. Antrenör & Ücret (Md. 22-23)" },
                                { id: "saglik", label: "5. Sağlık & Sporcu Kayıt (Md. 24-25)" },
                                { id: "vize", label: "6. Vize & Nihai Karar" }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setSubTab(tab.id)}
                                    className={`px-3 py-2 rounded-xl text-xs font-black transition-all ${
                                        subTab === tab.id
                                            ? "bg-blue-600 text-white shadow-sm"
                                            : "bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200"
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="flex items-center gap-2">
                            <input
                                type="text"
                                placeholder="Maddelerde ara..."
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="h-8 px-3 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs w-36 sm:w-48"
                            />
                            <button
                                onClick={() => setFilterOnlyMissing(!filterOnlyMissing)}
                                className={`h-8 px-2.5 rounded-lg text-xs font-bold border transition-all ${
                                    filterOnlyMissing ? "bg-rose-50 border-rose-300 text-rose-600" : "bg-white border-slate-200"
                                }`}
                            >
                                ⚠️ Sadece Eksikler
                            </button>
                            {["evrak", "fiziki", "antrenor", "saglik"].includes(subTab) && (
                                <button
                                    onClick={handleMarkAllValid}
                                    className="h-8 px-2.5 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-600 text-xs font-bold"
                                >
                                    ✓ Tümünü Uygun Yap
                                </button>
                            )}
                        </div>
                    </div>

                    {/* SEKME İÇERİKLERİ */}
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm no-print">
                        {subTab === "evrak" && (
                            <div>
                                <h3 className="text-sm font-black mb-3">
                                    {formData.tur === "gercek" ? "Gerçek Kişilerden İstenecek Belgeler (Excel Sayfa 1)" : "Tüzel Kişilerden İstenecek Belgeler (Excel Sayfa 2)"}
                                </h3>
                                {(formData.tur === "gercek" ? GERCEK_KISI_EVRAKLARI : TUZEL_KISI_EVRAKLARI).map(it => renderRow("evraklar", it))}
                            </div>
                        )}

                        {subTab === "komisyon" && (
                            <div className="space-y-4">
                                <h3 className="text-sm font-black border-b pb-2">Açılış İzin Komisyonu ve Tescil Harcı Paylaşımı</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                    <div className="p-4 rounded-xl border bg-slate-50 dark:bg-slate-800/40 space-y-2">
                                        <h4 className="font-bold">1. Açılış Komisyonu Üyeleri & Vali Onayı (Md. 12)</h4>
                                        <div className="flex items-center justify-between">
                                            <span>Vali Onayı Var mı?</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => handleKomisyonChange("valiOnayi", "var")} className={`px-2 py-1 rounded font-bold ${formData.komisyon.valiOnayi === "var" ? "bg-emerald-600 text-white" : "bg-slate-200"}`}>Evet</button>
                                                <button onClick={() => handleKomisyonChange("valiOnayi", "yok")} className={`px-2 py-1 rounded font-bold ${formData.komisyon.valiOnayi === "yok" ? "bg-rose-600 text-white" : "bg-slate-200"}`}>Hayır</button>
                                            </div>
                                        </div>
                                        <input type="text" placeholder="Komisyon Başkanı (İl Müdürü / Şb. Md.)" value={formData.komisyon.ilMudurBaskan} onChange={e => handleKomisyonChange("ilMudurBaskan", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                        <input type="text" placeholder="Spor Şube Müdürü" value={formData.komisyon.sporSbMd} onChange={e => handleKomisyonChange("sporSbMd", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                        <input type="text" placeholder="Tesisler Şube Müdürü" value={formData.komisyon.tesislerSbMd} onChange={e => handleKomisyonChange("tesislerSbMd", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                        <input type="text" placeholder="Federasyon Temsilcisi" value={formData.komisyon.fedTemsilcisi} onChange={e => handleKomisyonChange("fedTemsilcisi", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                        <input type="text" placeholder="İl Sağlık Müdürlüğü Temsilcisi (1 Kişi)" value={formData.komisyon.saglikTemsilcisi} onChange={e => handleKomisyonChange("saglikTemsilcisi", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                    </div>

                                    <div className="p-4 rounded-xl border bg-slate-50 dark:bg-slate-800/40 space-y-2">
                                        <h4 className="font-bold">2. Tescil Harcı Tahakkuku ve Paylaşım (Md. 11)</h4>
                                        <div className="flex gap-2">
                                            <select value={formData.komisyon.tescilUcretiTahsilat} onChange={e => handleKomisyonChange("tescilUcretiTahsilat", e.target.value)} className="h-8 px-2 border rounded font-bold">
                                                <option value="">Seçiniz</option>
                                                <option value="var">Tahsil Edildi</option>
                                                <option value="yok">Edilmedi</option>
                                            </select>
                                            <input type="text" placeholder="Tutar TL" value={formData.komisyon.tescilUcretiTutar} onChange={e => handleKomisyonChange("tescilUcretiTutar", e.target.value)} className="h-8 px-2 border rounded flex-1" />
                                        </div>
                                        <div className="p-3 bg-blue-50 dark:bg-blue-950/20 rounded border space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span>%50 Genel Müdürlük Hesabına Yatırıldı mı?</span>
                                                <button onClick={() => handleKomisyonChange("genelMudurPayiYatırıldı", formData.komisyon.genelMudurPayiYatırıldı === "var" ? "yok" : "var")} className={`px-2 py-0.5 rounded font-bold ${formData.komisyon.genelMudurPayiYatırıldı === "var" ? "bg-emerald-600 text-white" : "bg-slate-200"}`}>{formData.komisyon.genelMudurPayiYatırıldı === "var" ? "Evet" : "Hayır"}</button>
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <span>%50 İl Müdürlüğü Hesabına Yatırıldı mı?</span>
                                                <button onClick={() => handleKomisyonChange("ilMudurPayiYatırıldı", formData.komisyon.ilMudurPayiYatırıldı === "var" ? "yok" : "var")} className={`px-2 py-0.5 rounded font-bold ${formData.komisyon.ilMudurPayiYatırıldı === "var" ? "bg-emerald-600 text-white" : "bg-slate-200"}`}>{formData.komisyon.ilMudurPayiYatırıldı === "var" ? "Evet" : "Hayır"}</button>
                                            </div>
                                        </div>
                                        <textarea rows={2} placeholder="Komisyon Notları..." value={formData.komisyon.aciklama} onChange={e => handleKomisyonChange("aciklama", e.target.value)} className="w-full p-2 border rounded" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {subTab === "fiziki" && (
                            <div>
                                <h3 className="text-sm font-black mb-3">Tesisin Fiziki ve Teknik Standartları (Md. 8 - 9)</h3>
                                {FIZIKI_SARTLAR_LISTESI.map(it => renderRow("fizikiSartlar", it))}
                            </div>
                        )}

                        {subTab === "antrenor" && (
                            <div>
                                <h3 className="text-sm font-black mb-3">Antrenör, Eğitici ve Personel Şartları (Md. 22 - 23)</h3>
                                {ANTRENOR_PERSONEL_LISTESI.map(it => renderRow("antrenorPersonel", it))}
                            </div>
                        )}

                        {subTab === "saglik" && (
                            <div>
                                <h3 className="text-sm font-black mb-3">Sağlık, İlk Yardım & Sporcu Kayıtları (Md. 16, 24, 25)</h3>
                                {SAGLIK_SPORCU_LISTESI.map(it => renderRow("saglikSporcu", it))}
                            </div>
                        )}

                        {subTab === "vize" && (
                            <div className="space-y-4 text-xs">
                                <h3 className="text-sm font-black border-b pb-2">Yıllık Vize Takibi, İPC ve Müfettiş Kararı (Md. 13, 26)</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-4 rounded-xl border bg-slate-50 space-y-2">
                                        <h4 className="font-bold">Yıllık Vize Kontrolü</h4>
                                        <div className="flex items-center justify-between">
                                            <span>Yıllık Vizesi Komisyonca Yapılmış mı?</span>
                                            <button onClick={() => handleVizeChange("yillikVizeYapildiMi", formData.vizeYaptirim.yillikVizeYapildiMi === "var" ? "yok" : "var")} className={`px-2 py-1 rounded font-bold ${formData.vizeYaptirim.yillikVizeYapildiMi === "var" ? "bg-emerald-600 text-white" : "bg-slate-200"}`}>{formData.vizeYaptirim.yillikVizeYapildiMi === "var" ? "Evet" : "Hayır"}</button>
                                        </div>
                                        <input type="date" value={formData.vizeYaptirim.vizeOnayTarihi} onChange={e => handleVizeChange("vizeOnayTarihi", e.target.value)} className="w-full h-8 px-2 border rounded" />
                                    </div>
                                    <div className="p-4 rounded-xl border bg-slate-50 space-y-2">
                                        <h4 className="font-bold">Müfettiş Nihai Kanaat ve Tutanak Notu</h4>
                                        <textarea rows={3} value={formData.vizeYaptirim.sonucKarari} onChange={e => handleVizeChange("sonucKarari", e.target.value)} className="w-full p-2 border rounded font-medium" />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* YAZDIRMA ALANI (PRINT VIEW) */}
                    <div id="print-area" className="hidden print:block p-8">
                        <div className="text-center border-b-2 border-blue-600 pb-3 mb-4">
                            <h1 className="text-lg font-black">T.C. GENÇLİK VE SPOR BAKANLIĞI</h1>
                            <h2 className="text-sm font-bold text-slate-600">REHBERLİK VE DENETİM BAŞKANLIĞI / İL MÜDÜRLÜĞÜ TEFTİŞİ</h2>
                            <h2 className="text-base font-black text-blue-700 mt-1">ÖZEL BEDEN EĞİTİMİ VE SPOR TESİSİ DENETİM TUTANAĞI</h2>
                        </div>

                        <div className="mb-4">
                            <h3 className="font-black text-xs bg-slate-100 p-1 border-l-4 border-blue-600 mb-2">I. TESİS BİLGİLERİ</h3>
                            <table className="w-full text-xs border border-slate-300">
                                <tbody>
                                    <tr className="border-b">
                                        <td className="p-1 font-bold w-1/4">Tesis Adı:</td>
                                        <td className="p-1 w-1/4">{formData.tesisAdi}</td>
                                        <td className="p-1 font-bold w-1/4">Tesis Türü:</td>
                                        <td className="p-1 w-1/4">{formData.tur === "gercek" ? "Gerçek Kişi" : "Tüzel Kişi"}</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="p-1 font-bold">İşletici / Sorumlu:</td>
                                        <td className="p-1">{formData.isleticiSahip}</td>
                                        <td className="p-1 font-bold">T.C. / VKN:</td>
                                        <td className="p-1">{formData.tcVkn}</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="p-1 font-bold">Spor Dalları:</td>
                                        <td className="p-1">{formData.branslar}</td>
                                        <td className="p-1 font-bold">İlçe / Adres:</td>
                                        <td className="p-1">{formData.adres}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div className="mb-4">
                            <h3 className="font-black text-xs bg-slate-100 p-1 border-l-4 border-blue-600 mb-2">II. AÇILIŞ VE MEVZUAT EVRAKLARI</h3>
                            <table className="w-full text-[10px] border border-slate-300">
                                <thead>
                                    <tr className="bg-slate-50 border-b">
                                        <th className="p-1 text-left w-8">No</th>
                                        <th className="p-1 text-left">İstenen Belge</th>
                                        <th className="p-1 text-left w-24">Ref</th>
                                        <th className="p-1 text-left w-24">Durum</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(formData.tur === "gercek" ? GERCEK_KISI_EVRAKLARI : TUZEL_KISI_EVRAKLARI).map(it => {
                                        const d = formData.evraklar?.[it.id] || { status: "", note: "" };
                                        return (
                                            <tr key={it.id} className="border-b">
                                                <td className="p-1">{it.no}</td>
                                                <td className="p-1">{it.madde}</td>
                                                <td className="p-1">{it.ref}</td>
                                                <td className="p-1 font-bold">{d.status === "var" ? "VAR" : d.status === "yok" ? "YOK" : d.status === "muaf" ? "MUAF" : "-"}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        <div className="mb-6">
                            <h3 className="font-black text-xs bg-slate-100 p-1 border-l-4 border-blue-600 mb-2">III. MÜFETTİŞ KANAATİ VE İMZA</h3>
                            <p className="text-xs mb-8"><b>Nihai Kanaat:</b> {formData.vizeYaptirim.sonucKarari || "Mevzuat hükümleri doğrultusunda denetim tamamlanmıştır."}</p>
                            <div className="flex justify-around text-center text-xs">
                                <div>
                                    <p className="font-bold">Tesis Yetkilisi / Sahibi</p>
                                    <p className="mt-10">İmza</p>
                                </div>
                                <div>
                                    <p className="font-bold">Denetim Görevlisi / Müfettiş</p>
                                    <p className="mt-10">İmza</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
