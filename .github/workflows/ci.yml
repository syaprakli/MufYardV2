name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Sözdizimi kontrolü
        run: python -m compileall -q app
      - name: Güvenlik testleri
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend kontrolleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Electron dosyaları sözdizimi kontrolü
        run: node --check main.cjs && node --check preload.cjs && node --check masaustuAyarlari.cjs
      - name: TypeScript ve web build
        run: npm run build:web
      - name: Bağımlılık güvenlik taraması
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Gizli anahtar taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Private key / API anahtarı kontrolü
        run: |
          if git grep -nIE "BEGIN (RSA |EC )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}" -- . ':!*.lock' ':!*package-lock.json' ':!*.example'; then
            echo "::error::Repoda gizli anahtar bulundu. Anahtarı kaldırın ve iptal edin."
            exit 1
          fi
